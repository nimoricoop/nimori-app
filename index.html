<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NIMORI · co-op liquidity</title>
  <meta name="description" content="Co-op liquidity on Robinhood Chain. You bring ETH, player 2 brings the token. Pre-launch: plug in your wallet for the $NIMORI draw.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23E60211%22/%3E%3Ccircle cx=%2224%22 cy=%2216%22 r=%224%22 fill=%22%23FF7A1A%22/%3E%3Crect x=%226%22 y=%2212%22 width=%2210%22 height=%228%22 rx=%222%22 fill=%22%23FEF3D5%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="img/wordmark.webp">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- boot screen: shown until fonts, logo and the 3D console are ready (JS removes it; the inline timer is a safety net) -->
  <div class="boot" id="boot" role="status" aria-live="polite">
    <img class="boot-logo" src="img/wordmark.webp" alt="NIMORI" width="637" height="156">
    <div class="boot-bar"><i id="bootFill"></i></div>
    <div class="boot-txt" id="bootTxt">LOADING</div>
    <div class="boot-foot">CO-OP LIQUIDITY · ROBINHOOD CHAIN</div>
  </div>
  <script>window.__bootT0=Date.now();setTimeout(function(){var b=document.getElementById('boot');if(b)b.classList.add('gone')},8000)</script>
  <header class="topbar">
    <a class="wordmark" href="#/lobby" aria-label="NIMORI home"><img src="img/wordmark.webp" alt="NIMORI" width="637" height="156"></a>
    <nav class="tabs" aria-label="Screens">
      <a href="#/lobby" data-route="lobby">Lobby</a>
      <a href="#/arcade" data-route="arcade">Arcade</a>
      <a href="#/docs" data-route="docs">Docs</a>
      <a href="#/draw" data-route="draw" class="tab-draw">Draw</a>
    </nav>
    <div class="topbar-right">
      <span class="pill chain"><i></i>Robinhood Chain</span>
      <span class="pill demo">PRE-LAUNCH</span>
      <a class="sound gh" href="https://github.com/nimoricoop/nimori-app" target="_blank" rel="noopener" aria-label="NIMORI on GitHub" title="Open source on GitHub"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="none" d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.56-.29-5.25-1.28-5.25-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.39-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg></a>
      <button class="sound" type="button" data-mute aria-label="Arcade sounds"></button>
      <button class="btn btn-small" type="button" data-connect>Connect wallet</button>
    </div>
  </header>

  <!-- persistent stage: the single WebGL canvas lives here, outside the router outlet -->
  <div class="stage" id="stage">
    <div class="stage-vignette"></div>
    <div class="hud" id="hud" aria-live="polite">
      <span class="hud-label" id="hud-label">waiting for player 2</span>
      <span class="hud-bar" id="hud-bar">▮▮▮▯▯</span>
    </div>
    <div class="matched" id="matched" aria-hidden="true">
      <div class="matched-word">PLUGGED IN</div>
      <div class="matched-sub">you are in the draw</div>
    </div>
  </div>

  <main class="outlet">
    <section class="panel" data-panel id="screen" tabindex="-1"></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal" id="modal" hidden><div class="modal-card" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
