<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NIMORI film rig ep.2</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #stage canvas { display: block; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #vignette { background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0,0,0,0) 45%, rgba(8,0,0,0.78) 100%); }
  #grain { opacity: .06; mix-blend-mode: overlay; width: 100%; height: 100%; }
  #iris { background: #000; }
  #black { background: #000; }
  .card { display: flex; align-items: center; justify-content: center; flex-direction: column; }
  #opener { gap: 44px; }
  #opener img { width: 760px; height: auto; }
  #tag { font: 22px/1 "Press Start 2P", monospace; letter-spacing: .14em; color: #F3AE15; text-shadow: 3px 3px 0 #6A0200; min-height: 22px; white-space: pre; }
  .cur { display: inline-block; width: .8em; height: .9em; background: #F3AE15; vertical-align: -0.05em; margin-left: .2em; box-shadow: 3px 3px 0 #6A0200; }
  #endcard { gap: 0; }
  #reg { font: 66px/1 "Press Start 2P", monospace; letter-spacing: .06em; color: #F3AE15; text-shadow: 6px 6px 0 #6A0200; white-space: pre; }
  #url { margin-top: 64px; font: 30px/1 "Press Start 2P", monospace; letter-spacing: .08em; color: #FEF3D5; white-space: pre; min-height: 30px; }
  #url { position: relative; }
  #url .cur { background: #FEF3D5; box-shadow: none; position: absolute; margin-left: .35em; bottom: .05em; }
  #handle { margin-top: 30px; font: 500 28px/1 "IBM Plex Mono", monospace; color: #c9a98a; letter-spacing: .08em; min-height: 28px; }
  #scan { background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, transparent 2px 5px); }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="vignette"></div>
  <div class="layer" id="iris"></div>
  <div class="layer" id="black"></div>
  <div class="layer card" id="opener"><img id="wm" src="../img/wordmark-lg.webp" alt=""><div id="tag"></div></div>
  <div class="layer card" id="endcard"><div id="reg"></div><div id="url"></div><div id="handle"></div></div>
  <div class="layer" id="scan"></div>
  <canvas class="layer" id="grain" width="960" height="540"></canvas>
</div>
<script type="module">
  await document.fonts.ready;
  await Promise.all([
    document.fonts.load('400 96px "Lilita One"'),
    document.fonts.load('500 30px "IBM Plex Mono"'),
    document.fonts.load('700 44px "IBM Plex Mono"'),
    document.fonts.load('22px "Press Start 2P"'),
    document.fonts.load('30px "VT323"'),
  ]);
  const { createFilmScene } = await import('./scene-ep2.js');
  const stage = document.getElementById('stage');
  const film = createFilmScene(stage, { width: 1920, height: 1080 });
  stage.insertBefore(film.renderer.domElement, stage.firstChild);
  film.renderer.domElement.style.position = 'absolute';
  await film.ready;
  const wm = document.getElementById('wm'); await wm.decode().catch(() => {});

  const $ = (id) => document.getElementById(id);
  const black = $('black'), iris = $('iris'), opener = $('opener'), tag = $('tag'), end = $('endcard');
  const reg = $('reg'), url = $('url'), handle = $('handle'), scan = $('scan');
  const grain = $('grain');
  const gctx = grain.getContext('2d');
  const gimg = gctx.createImageData(960, 540);
  function drawGrain(frame) {
    let s = (frame * 2654435761) >>> 0 || 1;
    for (let i = 0; i < gimg.data.length; i += 4) {
      s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
      const v = s & 255; gimg.data[i] = gimg.data[i + 1] = gimg.data[i + 2] = v; gimg.data[i + 3] = 255;
    }
    gctx.putImageData(gimg, 0, 0);
  }
  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const lin = (a, b, x) => clamp01((x - a) / (b - a));
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const typed = (str, t0, t, cps) => str.slice(0, Math.max(0, Math.floor((t - t0) * cps)));
  const cur = (on) => `<span class="cur" style="opacity:${on ? 1 : 0}"></span>`;

  const T = film.T;
  const O = { tagA: 0.45, tagOut: 1.5, outA: 1.55, outB: 1.9, irisA: 2.0, irisB: 2.95 };
  const E = { regA: T.cut + 0.3, urlA: T.cut + 1.05, hA: T.cut + 1.75, end: T.cut + 3.85 };
  window.__cine = {
    duration: E.end,
    T, O, E,
    renderAt(t) {
      const frame = Math.round(t * 30);
      drawGrain(frame);
      // --- opener: exactly where ep.1 ended, wordmark held on black, then a chapter tag ---
      if (t < O.irisA) {
        black.style.opacity = 1; iris.style.opacity = 0; end.style.opacity = 0; scan.style.opacity = 0;
        const out = 1 - easeInOut(lin(O.outA, O.outB, t));
        opener.style.opacity = out.toFixed(3);
        wm.style.transform = `scale(${(1.034 + 0.012 * t).toFixed(4)})`;
        const s = typed('CHAPTER 2', O.tagA, t, 22);
        const blink = Math.floor((t - O.tagA) / 0.22) % 2 === 0;
        tag.innerHTML = t < O.tagA ? '' : s + cur(s.length < 9 || blink);
        return true;
      }
      opener.style.opacity = 0;
      // --- console: iris opens on the screen, then the scene plays to the cut ---
      if (t < T.cut) {
        film.renderAt(t);
        black.style.opacity = 0; end.style.opacity = 0; scan.style.opacity = 0;
        const p = easeInOut(lin(O.irisA, O.irisB, t));
        if (p >= 1) iris.style.opacity = 0;
        else {
          const r = 20 + p * 1250;
          iris.style.opacity = 1;
          const m = `radial-gradient(circle at 50% 47%, transparent ${r.toFixed(1)}px, #000 ${(r + 90).toFixed(1)}px)`;
          iris.style.webkitMaskImage = m; iris.style.maskImage = m;
        }
        return true;
      }
      // --- end card: hard cut to black, call to action ---
      iris.style.opacity = 0; black.style.opacity = 1; end.style.opacity = 1; scan.style.opacity = 0.55;
      const rp = lin(E.regA, E.regA + 0.15, t);
      reg.textContent = t >= E.regA ? 'REGISTRATION OPEN' : '';
      reg.style.transform = `scale(${(0.8 + 0.2 * Math.ceil(rp * 3) / 3 + 0.01 * Math.max(0, t - E.regA)).toFixed(4)})`;
      reg.style.opacity = t >= E.regA ? Math.max(0.34, Math.ceil(rp * 3) / 3) : 0;
      const u = t >= E.urlA ? typed('playnimori.com', E.urlA, t, 28) : '';
      url.innerHTML = t >= E.urlA ? u + cur(u.length < 14 || Math.floor((t - E.urlA) / 0.4) % 2 === 0) : '';
      handle.textContent = ''; // no handle on the end card
      handle.style.opacity = clamp01((t - E.hA) / 0.2).toFixed(3);
      return true;
    },
  };
  window.__cine.renderAt(0);
  document.title = 'NIMORI film rig ep.2 · ready';
</script>
</body>
</html>
