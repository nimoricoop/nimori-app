<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NIMORI film rig</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #stage canvas { display: block; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #vignette { background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0,0,0,0) 45%, rgba(8,0,0,0.78) 100%); }
  #grain { opacity: .06; mix-blend-mode: overlay; width: 100%; height: 100%; }
  #caption { position: absolute; left: 96px; bottom: 92px; font: 500 30px/1 "IBM Plex Mono", monospace; letter-spacing: .06em; color: #FEF3D5; text-shadow: 0 0 18px rgba(255,122,26,.45); white-space: pre; }
  #caption .cur { display: inline-block; width: .62em; height: 1em; background: #FF7A1A; vertical-align: -0.14em; margin-left: .15em; }
  #caption.ok { color: #d9ffc9; text-shadow: 0 0 18px rgba(140,255,90,.45); }
  #caption.ok .cur { background: #8cff5a; }
  #black { background: #000; }
  #endcard { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 34px; }
  #endcard img { width: 760px; height: auto; }
  #handle { font: 500 34px/1 "IBM Plex Mono", monospace; color: #FEF3D5; letter-spacing: .08em; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="vignette"></div>
  <canvas class="layer" id="grain" width="960" height="540"></canvas>
  <div id="caption"></div>
  <div class="layer" id="black"></div>
  <div class="layer" id="endcard"><img id="wm" src="../img/wordmark.webp" alt=""><div id="handle"></div></div>
</div>
<script type="module">
  await document.fonts.ready;
  await Promise.all([
    document.fonts.load('400 96px "Lilita One"'),
    document.fonts.load('700 44px "IBM Plex Mono"'),
    document.fonts.load('500 30px "IBM Plex Mono"'),
    document.fonts.load('700 22px "Plus Jakarta Sans"'),
  ]);
  const { createFilmScene } = await import('./scene-film.js');
  const stage = document.getElementById('stage');
  const film = createFilmScene(stage, { width: 1920, height: 1080 });
  stage.insertBefore(film.renderer.domElement, stage.firstChild);
  film.renderer.domElement.style.position = 'absolute';
  await film.ready;
  const wm = document.getElementById('wm'); await wm.decode().catch(() => {});

  const cap = document.getElementById('caption');
  const black = document.getElementById('black');
  const end = document.getElementById('endcard');
  const handle = document.getElementById('handle');
  const grain = document.getElementById('grain');
  const gctx = grain.getContext('2d');
  const gimg = gctx.createImageData(960, 540);
  function drawGrain(frame) {
    let s = (frame * 2654435761) >>> 0 || 1;
    for (let i = 0; i < gimg.data.length; i += 4) {
      s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
      const v = s & 255; gimg.data[i] = gimg.data[i + 1] = gimg.data[i + 2] = v; gimg.data[i + 3] = 255;
    }
    gctx.putImageData(gimg, 0, 0);
  }
  const T = film.T;
  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  function typed(str, t0, t, cps = 22) { return str.slice(0, Math.max(0, Math.floor((t - t0) * cps))); }

  // end: hard cut at T.cut -> black -> wordmark -> black -> handle -> black
  const E = { wmA: T.cut + 0.4, wmB: T.cut + 1.75, hA: T.cut + 2.15, hB: T.cut + 3.25, end: T.cut + 3.6 };
  window.__cine = {
    duration: E.end,
    renderAt(t) {
      const frame = Math.round(t * 30);
      drawGrain(frame);
      if (t < T.cut) {
        film.renderAt(t);
        // fade up from black over the first 0.9 s
        black.style.opacity = (1 - clamp01(t / 0.9)).toFixed(3);
        end.style.opacity = 0;
        // caption
        const blink = Math.floor(t * 2.2) % 2 === 0;
        let txt = '', ok = false, op = 0;
        if (t >= 1.2 && t < T.plugSnap) { txt = typed('waiting for player 2', 1.2, t); op = 1; }
        else if (t >= T.plugSnap && t < 7.2) { txt = typed('player 2 connected', T.plugSnap + 0.15, t, 30); ok = true; op = 1 - clamp01((t - 6.7) / 0.5); }
        cap.className = ok ? 'ok' : '';
        cap.style.opacity = op.toFixed(3);
        cap.innerHTML = txt.replace(/&/g, '&amp;').replace(/</g, '&lt;') + (blink || txt.length < 18 ? '<span class="cur"></span>' : '<span class="cur" style="opacity:0"></span>');
      } else {
        black.style.opacity = 1;
        cap.style.opacity = 0;
        const showWm = t >= E.wmA && t < E.wmB;
        const showH = t >= E.hA && t < E.hB;
        end.style.opacity = showWm || showH ? 1 : 0;
        wm.style.display = showWm ? 'block' : 'none';
        wm.style.transform = `scale(${(1 + 0.025 * (t - E.wmA)).toFixed(4)})`;
        handle.style.display = showH ? 'block' : 'none';
        handle.textContent = showH ? '@nimoricoop' : '';
      }
      return true;
    },
  };
  window.__cine.renderAt(0);
  document.title = 'NIMORI film rig · ready';
</script>
</body>
</html>
